# Weekly, grouped, so updates arrive as a handful of reviewable pull requests
# rather than dozens. Actions are pinned by commit (PRACTICES DSO-3); Dependabot
# is what keeps those pins from going stale.
#
# The ignore rules below were added after the first week (5 November 2026), when
# Dependabot proposed three updates that would have broken something while CI
# stayed green: React Native 0.76 to 0.88 on its own (it must move with the Expo
# SDK), react-dom without react (React requires the two at one version, and the
# Expo app is on React 18), and the API image's Node major without CI's.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The Expo SDK fixes these versions as a set; any change beyond a patch is
      # the planned SDK upgrade (docs/PLAN.md Phase 2.1), not a bot's single bump.
      # React Native 0.x minors are breaking releases.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The web apps are on React 19 and the Expo apps on React 18 (pinned by the
      # SDK). A major here can only mean dragging an Expo app across, so it waits
      # for the SDK upgrade too.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
    groups:
      # react and react-dom must be the same version, so they only ever move together.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      mobile:
        patterns: ["expo", "expo-*", "@expo/*", "react-native", "react-native-*", "@react-native/*"]
        update-types: ["patch"]
      web-and-server:
        patterns: ["*"]
        exclude-patterns:
          - "expo"
          - "expo-*"
          - "@expo/*"
          - "react-native"
          - "react-native-*"
          - "@react-native/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: weekly
    ignore:
      # The image's Node version moves together with CI's node-version and the
      # engines field, in one deliberate change, so the runtime is the one the
      # tests ran on. Digest and patch updates still come through.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
