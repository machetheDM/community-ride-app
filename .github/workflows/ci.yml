name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Read-only token. No job here publishes, comments or deploys, so none needs more;
# a compromised step then has nothing to write with.
permissions:
  contents: read

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma instantiates its client at module import, so the build needs a
  # syntactically valid connection string. Nothing here connects to a database:
  # every DB-backed page is force-dynamic and the unit tests do not touch one.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  JWT_SECRET: ci-test-secret-not-used-in-production

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npx turbo lint
      - name: Type check
        run: npx turbo typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: Run unit tests
        run: npx turbo test
        env:
          NODE_ENV: test

  integration:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    needs: lint
    # The route handlers against a real database: the access-control holes, the
    # two-drivers-one-ride race and the lifecycle rules are only proven with real
    # SQL and real transactions. The database is a throwaway service container;
    # the suite refuses any host but localhost (apps/api/jest.integration.config.mjs).
    services:
      postgres:
        # Pinned by digest, like every other input (PRACTICES DSO-3). Postgres 16.15.
        image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
        env:
          POSTGRES_USER: ride
          POSTGRES_PASSWORD: throwaway
          POSTGRES_DB: ride_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ride -d ride_it"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - run: npm run db:generate -w @ride/db
      - name: Run integration tests
        # Global setup applies every migration with `prisma migrate deploy`, the
        # command a deployment runs, so a migration that fails fails here first.
        run: npm run test:integration -w @ride/api
        env:
          NODE_ENV: test
          TEST_DATABASE_URL: postgresql://ride:throwaway@localhost:5432/ride_it

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: "npm"
      - run: npm ci
      - name: Build web apps
        run: npx turbo build

  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform fmt -check -recursive
        working-directory: infra/gcp
      - name: Validate
        # -backend=false so this needs no credentials and makes no contact with
        # GCP. Validation is a syntax and type check against the provider schema,
        # not a plan — it cannot read or change any real infrastructure.
        run: |
          terraform init -backend=false
          terraform validate
        working-directory: infra/gcp

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the Cloud Run image
        # Build only — never pushed from CI, and no registry credentials are
        # present. This exists so a Dockerfile that cannot build is caught here
        # rather than at deploy time. Context is the repo root because the API
        # imports four workspace packages.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
