version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: community-ride-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride_secret
      POSTGRES_DB: community_ride
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ride -d community_ride"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
